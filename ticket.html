<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#000000">
  <title>チケット発券</title>
  <link rel="stylesheet" href="style.css" >
</head>

<body>
  <main>
    <button type="button" onclick="history.back()">←前のページへ戻る</button>
    <header class="head">
      <p id="head-p">DIG FND49 FINAL PROJECT</p>
      <h1 id="title">LIVE TICKET SIMULATOR</h1>
      <p class="middle-p">～運試し！今日のあなたの座席はどこ！？～</p>
      <p class="middle-p">会場を選択し、座席が発見される瞬間を体験しよう！！</p>
    </header>

    <section class="ticket-area">
        <p class="enter-p">入場受付中</p>

          <h2 id="live-name">DIG FND49 FINAL PROJECT LIVE</h2>
          <h3 id="stadium-name"></h3>
          <p id="date">2026.10.01 / OPEN 09:00 / START 10:44</p>
          <button id="scan-btn">QRコードをかざす</button>
          <p id="scan-message"></p>
          <p>ボタンを押すと入場処理が始まります</p>
        </div>
    </section>

    <footer>
      <p>背景画像:<a href="https://pixabay.com/photos/ticket-coupon-admission-carnival-2974645/">出典 O-DAN</a></p>
    </footer>

  </main>

  <script src="ticket.js"></script>

</html>
