
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
  <title>LIVE TICKET</title>
</head>

<body>
  <main>
    <header class="head">
      <p id="head-p">DIG FND49 FINAL PROJECT</p>
      <h1 id="title">LIVE TICKET SIMULATOR</h1>
      <p class="middle-p">～運試し！今日のあなたの座席はどこ！？～</p>
      <p class="middle-p">会場を選択し、座席が発見される瞬間を体験しよう！！</p>
    </header>

    <div class="place-buttons">
      <label class="place-card">
        <input type="radio" id="place01"  name="place" value="味の素スタジアム"> 
        <div class="stadium">
          <h2>味の素スタジアム</h2>
          <p>東京都</p>
        </div>
      </label>

      <label class="place-card">
        <input type="radio" id="place02" name="place" value="ヤンマースタジアム長居">
        <div class="stadium">
          <h2>ヤンマースタジアム長居</h2>
          <p>大阪府</p>
        </div>
      </label>

      <label class="place-card">
        <input type="radio" id="place03" name="place" value="日産スタジアム">
        <div class="stadium">
          <h2>日産スタジアム</h2>
          <p>神奈川県</p>
        </div>
      </label>

    </div>

    <button id="enter-btn">この会場に入場する</button>

    <footer>
      <p>背景画像:<a href="https://pixabay.com/photos/ticket-coupon-admission-carnival-2974645/">出典 O-DAN</a></p>
    </footer>

  </main>
  <script src="script.js"></script>
</body>

</html>
